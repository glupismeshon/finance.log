      </div>
    </main>

    <div class="side">
      <section class="box s-journal" id="balance-box" aria-labelledby="balance-label">
        <h2 class="box-label" id="balance-label" data-i18n="balance.title"></h2>
        <div class="box-body">
          <div class="balance-number" id="balance">0<span class="balance-decimals">,00 ₽</span></div>
          <div class="log-lines">
            <div class="log-line"><span class="tag ok">[ok]</span><span class="log-name" data-i18n="balance.income"></span><strong class="income" id="income-total">+0,00 ₽</strong></div>
            <div class="log-line"><span class="tag warn">[--]</span><span class="log-name" data-i18n="balance.expense"></span><strong id="expense-total">−0,00 ₽</strong></div>
          </div>
          <div class="muted opening-line"><span data-i18n="balance.accounts"></span> <span id="accounts-count">1</span> <button class="bracket" id="accounts-link" type="button" data-i18n-aria-label="balance.accountsAria" data-i18n="balance.accountsLink"></button></div>
          <div class="muted opening-line hint" data-i18n="balance.note"></div>
        </div>
      </section>

      <section class="box" id="entry-box" aria-labelledby="form-title">
        <h2 class="box-label" id="form-title"></h2>
        <button type="button" class="bracket sheet-close" id="sheet-close" data-i18n-aria-label="form.closeAria">[×]</button>
        <div class="box-body">
          <form id="entry-form" novalidate>
            <div class="type-switch" role="group" data-i18n-aria-label="form.typeAria">
              <button type="button" data-type="expense" class="selected" aria-pressed="true" data-i18n="form.typeExpense"></button>
              <button type="button" data-type="income" aria-pressed="false" data-i18n="form.typeIncome"></button>
              <button type="button" data-type="transfer" aria-pressed="false" id="transfer-switch" data-i18n="form.typeTransfer"></button>
            </div>
            <label class="field-label" for="amount" data-i18n="form.amount"></label>
            <div class="amount-field"><input id="amount" type="text" inputmode="decimal" data-i18n-placeholder="amount.ph" autocomplete="off" required maxlength="20"><span aria-hidden="true">₽</span></div>
            <div class="amount-hint muted hint" id="amount-hint" hidden></div>
            <div class="receipt-bar" id="receipt-bar">
              <button type="button" class="bracket" id="receipt-toggle" aria-expanded="false" aria-controls="receipt"></button>
              <span class="muted" id="amount-note" hidden></span>
              <button type="button" class="bracket" id="amount-mode" hidden></button>
            </div>
            <div class="receipt" id="receipt" hidden>
              <div class="receipt-rows" id="receipt-rows"></div>
              <div class="receipt-add">
                <button type="button" class="bracket" id="receipt-add-item" data-i18n="receipt.addItem"></button>
                <button type="button" class="bracket" id="receipt-add-discount" data-i18n="receipt.addDiscount"></button>
                <button type="button" class="bracket" id="receipt-add-fee" data-i18n="receipt.addFee"></button>
              </div>
              <div class="receipt-sum muted" id="receipt-sum"></div>
              <div class="receipt-diff" id="receipt-diff" role="alert" hidden>
                <div id="receipt-diff-text"></div>
                <div class="receipt-diff-btns">
                  <button type="button" class="bracket" id="diff-discount"></button>
                  <button type="button" class="bracket" id="diff-fee"></button>
                  <button type="button" class="bracket" id="diff-fix"></button>
                </div>
              </div>
            </div>
            <div id="merchant-field">
              <label class="field-label" for="merchant"><span id="merchant-label"></span> <span class="muted hint" data-i18n="common.optional"></span></label>
              <input id="merchant" type="text" maxlength="80" autocomplete="off" autocapitalize="sentences" enterkeyhint="next">
              <div class="chips" id="merchant-chips" data-i18n-aria-label="form.merchantChipsAria"></div>
            </div>
            <div id="category-field">
              <div class="field-label"><span data-i18n="form.category"></span> <span class="muted hint" data-i18n="common.optional"></span></div>
              <div class="chips" id="category-chips"></div>
              <button type="button" class="bracket chip-all" id="category-all" aria-expanded="false" aria-controls="category-tree" data-i18n="form.categoryAll"></button>
              <div class="cat-tree" id="category-tree" hidden></div>
            </div>
            <div id="account-field"><label class="field-label" for="account" id="account-select-label"></label><select id="account"></select></div>
            <div id="to-field" hidden><label class="field-label" for="account-to" data-i18n="form.to"></label><select id="account-to"></select></div>
            <div id="fee-field" hidden><label class="field-label" for="fee"><span data-i18n="form.fee"></span> <span class="muted hint" data-i18n="common.optional"></span></label><div class="amount-field"><input id="fee" type="text" inputmode="decimal" data-i18n-placeholder="amount.ph" autocomplete="off" maxlength="20"><span aria-hidden="true">₽</span></div></div>
            <label class="field-label" for="note"><span data-i18n="form.note"></span> <span class="muted hint" data-i18n="common.optional"></span></label>
            <input id="note" type="text" maxlength="160" autocomplete="off">
            <div class="date-row muted" id="date-row"><span data-i18n="form.dateRow"></span> <span id="date-summary"></span> <button class="bracket" id="date-toggle" type="button" data-i18n="common.edit"></button></div>
            <div id="date-field">
              <div class="field-label" id="date-label" data-i18n="form.date"></div>
              <div class="dp" data-label="date-label"><input id="date" type="hidden"></div>
            </div>
            <div id="form-error" class="form-error" role="alert"></div>
            <button type="submit" class="btn primary" id="save-button"><span></span><span aria-hidden="true">↵</span></button>
            <button type="button" class="btn ghost" id="cancel-edit" hidden data-i18n="form.cancelEdit"></button>
            <button type="button" class="bracket" id="delete-entry" hidden data-i18n="form.delete"></button>
            <p class="muted form-hint hint" id="form-hint" data-i18n-html="form.hint"></p>
          </form>
        </div>
      </section>
    </div>
  </div>

  <div id="sheet-backdrop" class="sheet-backdrop" hidden></div>

  <nav class="tabbar" id="tabbar" data-i18n-aria-label="tab.aria">
    <button type="button" class="tab active" data-tab="journal" aria-current="page"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg><span data-i18n="nav.journal"></span></button>
    <button type="button" class="tab" data-tab="accounts" aria-current="false"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></svg><span data-i18n="page.accounts"></span></button>
    <button type="button" class="tab" data-tab="analytics" aria-current="false"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg><span data-i18n="page.analytics"></span></button>
    <button type="button" class="tab" data-tab="plans" aria-current="false"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/></svg><span data-i18n="page.plans"></span></button>
    <button type="button" class="tab" data-tab="more" aria-current="false"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg><span data-i18n="page.more"></span></button>
  </nav>

  <div id="toast" class="toast" role="status" hidden><span class="toast-text" id="toast-message"></span><button id="undo-button" class="bracket accent-hover" type="button" hidden data-i18n="toast.undo"></button><button id="toast-close" class="bracket" type="button" data-i18n-aria-label="toast.closeAria">[×]</button></div>

  <section class="box sheet-form" id="account-box" role="dialog" aria-modal="true" aria-labelledby="account-title">
    <h2 class="box-label" id="account-title"></h2>
    <button type="button" class="bracket sheet-x" id="account-close" data-i18n-aria-label="common.close">[×]</button>
    <div class="box-body">
      <form id="account-form" novalidate>
        <label class="field-label first" for="account-name" data-i18n="acform.name"></label>
        <input id="account-name" type="text" maxlength="100" autocomplete="off" data-i18n-placeholder="acform.namePh">
        <label class="field-label" for="account-kind" data-i18n="acform.kind"></label>
        <select id="account-kind"></select>
        <label class="field-label" for="account-opening" data-i18n="acform.opening"></label>
        <div class="amount-field"><input id="account-opening" type="text" inputmode="decimal" data-i18n-placeholder="amount.ph" autocomplete="off" maxlength="21"><span aria-hidden="true">₽</span></div>
        <button type="button" class="bracket sign-btn" data-sign="account-opening" data-i18n="acform.minus"></button>
        <div class="field-label" id="account-date-label" data-i18n="acform.date"></div>
        <div class="dp" data-label="account-date-label"><input id="account-date" type="hidden"></div>
        <div id="account-error" class="form-error" role="alert"></div>
        <button type="submit" class="btn primary" id="account-save"><span data-i18n="acform.save"></span><span aria-hidden="true">↵</span></button>
      </form>
    </div>
  </section>

  <section class="box sheet-form" id="category-box" role="dialog" aria-modal="true" aria-labelledby="category-title">
    <h2 class="box-label" id="category-title"></h2>
    <button type="button" class="bracket sheet-x" id="category-close" data-i18n-aria-label="common.close">[×]</button>
    <div class="box-body">
      <form id="category-form" novalidate>
        <label class="field-label first" for="category-name" data-i18n="cat.name"></label>
        <input id="category-name" type="text" maxlength="100" autocomplete="off" data-i18n-placeholder="cat.namePh">
        <label class="field-label" for="category-parent" data-i18n="cat.parent"></label>
        <select id="category-parent"></select>
        <div id="category-error" class="form-error" role="alert"></div>
        <button type="submit" class="btn primary" id="category-save"><span data-i18n="acform.save"></span><span aria-hidden="true">↵</span></button>
        <button type="button" class="bracket sheet-archive" id="category-archive" hidden></button>
      </form>
    </div>
  </section>

  <section class="box sheet-form" id="recon-box" role="dialog" aria-modal="true" aria-labelledby="recon-title">
    <h2 class="box-label" id="recon-title"></h2>
    <button type="button" class="bracket sheet-x" id="recon-close" data-i18n-aria-label="common.close">[×]</button>
    <div class="box-body">
      <form id="recon-form" novalidate>
        <label class="field-label first" for="recon-bank" data-i18n="recon.bank"></label>
        <div class="amount-field"><input id="recon-bank" type="text" inputmode="decimal" data-i18n-placeholder="amount.ph" autocomplete="off" maxlength="21"><span aria-hidden="true">₽</span></div>
        <button type="button" class="bracket sign-btn" data-sign="recon-bank" data-i18n="acform.minus"></button>
        <div class="field-label" id="recon-date-label" data-i18n="recon.date"></div>
        <div class="dp" data-label="recon-date-label"><input id="recon-date" type="hidden"></div>
        <label class="field-label" for="recon-note"><span data-i18n="recon.note"></span> <span class="muted hint" data-i18n="common.optional"></span></label>
        <input id="recon-note" type="text" maxlength="160" autocomplete="off" data-i18n-placeholder="recon.notePh">
        <div class="muted recon-line" id="recon-calc"></div>
        <div class="recon-diff" id="recon-diff"></div>
        <div id="recon-error" class="form-error" role="alert"></div>
        <button type="submit" class="btn primary" id="recon-save"><span></span><span aria-hidden="true">↵</span></button>
      </form>
    </div>
  </section>

  <dialog id="import-dialog" aria-labelledby="import-title">
    <h2 class="box-label" id="import-title" data-i18n="import.title"></h2>
    <button type="button" data-close="import-dialog" class="bracket dialog-close" data-i18n-aria-label="common.close">[×]</button>
    <div class="dialog-body">
      <p id="import-description"></p>
      <p class="muted" data-i18n="import.note"></p>
      <div id="import-error" class="form-error" role="alert"></div>
      <button class="btn primary" id="confirm-import" type="button"><span data-i18n="import.confirm"></span><span aria-hidden="true">↑</span></button>
    </div>
  </dialog>
  <noscript><div class="error-banner">enable javascript to use finance.log.</div></noscript>
</body>
</html>
